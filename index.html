<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b1410">
<title>Munim ji</title>
<style>
:root{color-scheme:dark;--bg:#1b1410;--card:#2a201a;--me:#c8691e;--ai:#33271f;--tx:#f4e9dc;--mut:#a89683}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 12px;background:var(--card)}
header h1{font-size:17px;margin:0;flex:1 1 100%}
header button,.tabs button{background:none;border:1px solid var(--mut);color:var(--tx);border-radius:8px;padding:5px 8px;font-size:14px}
.tabs{display:flex;gap:6px;padding:8px 14px}
.tabs button.on{background:var(--me);border-color:var(--me)}
main{flex:1;overflow-y:auto;padding:10px 14px}
.msg{max-width:85%;padding:9px 12px;margin:6px 0;border-radius:14px;white-space:pre-wrap;line-height:1.4}
.me{background:var(--me);margin-left:auto}
.ai{background:var(--ai)}
.bar{display:flex;gap:6px;padding:10px 14px;background:var(--card);padding-bottom:max(10px,env(safe-area-inset-bottom))}
.bar input,textarea,.set input{flex:1;min-width:0;background:var(--bg);color:var(--tx);border:1px solid var(--mut);border-radius:10px;padding:10px;font-size:16px}
.bar button{border:0;border-radius:10px;padding:0 14px;font-size:20px;background:var(--me);color:#fff}
.note{background:var(--card);border-radius:10px;padding:10px;margin:6px 0;display:flex;gap:8px;align-items:flex-start}
.note span{flex:1;white-space:pre-wrap}
.note small{display:block;color:var(--mut)}
.note button{background:none;border:0;color:var(--mut);font-size:18px}
.set{display:none;padding:10px 14px;background:var(--card);gap:6px;flex-direction:column}
.set small{color:var(--mut)}
.hide{display:none!important}
#rbar{flex-direction:column}
#rbar .row{display:flex;gap:6px}
#alerts{position:fixed;top:0;left:0;right:0;z-index:9;padding:8px;padding-top:max(8px,env(safe-area-inset-top))}
.alert{background:var(--me);color:#fff;border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;font-size:17px}
.alert span{flex:1}
.alert button{background:#fff;color:#000;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
</style>
</head>
<body>
<div id="alerts"></div>
<header>
  <h1>🙏 Munim ji <small style="color:var(--mut);font-weight:400">v11</small></h1>
  <button id="brf">☀️</button>
  <button id="syn">🔄 Sync</button>
  <button id="clr">🧹</button>
  <button id="web">🌐 On</button>
  <button id="spk">🔊 On</button>
  <button id="nat">🎙️ Off</button>
  <button id="cfg">⚙️</button>
</header>
<div class="set" id="set">
  <small>Gemini API key (aistudio.google.com se free). Sirf is device me save hoti hai.</small>
  <input id="key" type="password" placeholder="API key paste karo">
  <button id="saveKey" style="padding:8px;border-radius:8px;border:0;background:var(--me);color:#fff">Save</button>
  <small style="margin-top:8px">Backup AI: Groq key (console.groq.com/keys se free). Gemini ki limit khatam ho to ye chalega.</small>
  <input id="gqkey" type="password" placeholder="Groq key paste karo (gsk_...)">
  <button id="saveGq" style="padding:8px;border-radius:8px;border:0;background:var(--me);color:#fff">Save Groq key</button>
  <small style="margin-top:8px">Sync (GitHub): private repo ka naam aur token. Sirf is device me save hota hai.</small>
  <input id="ghrepo" placeholder="Ashucryt71/munim-data">
  <input id="ghtok" type="password" placeholder="GitHub token paste karo">
  <button id="saveGh" style="padding:8px;border-radius:8px;border:0;background:var(--me);color:#fff">Save &amp; Sync</button>
</div>
<div class="tabs">
  <button id="tChat" class="on">💬 Chat</button>
  <button id="tNotes">📝 Notes</button>
  <button id="tRem">⏰ Reminders</button>
</div>
<main id="chat"></main>
<main id="notes" class="hide"></main>
<main id="rems" class="hide"></main>
<div class="bar" id="bar">
  <button id="mic">🎤</button>
  <input id="inp" placeholder="Munim ji se bolo ya likho…" autocomplete="off">
  <button id="send">➤</button>
</div>
<div class="bar hide" id="nbar">
  <input id="ninp" placeholder="Nayi note likho…">
  <button id="nadd">＋</button>
</div>
<div class="bar hide" id="rbar">
  <div class="row">
    <input id="rinp" placeholder="Kya yaad dilana hai?">
  </div>
  <div class="row">
    <input id="rdt" type="datetime-local">
    <button id="radd">＋</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const MODELS=["gemini-2.5-flash-lite","gemini-2.5-flash","gemini-flash-lite-latest","gemini-flash-latest"];
let applying=false,localUpd=0,syncing=false,pushTimer=null,ghSha=null;
const store={
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}
    if((k==="notes"||k==="rems")&&!applying)touchSync();}
};
let key=store.get("key",""), notes=store.get("notes",[]), hist=store.get("hist",[]), speak=store.get("speak",true), rems=store.get("rems",[]);
let busy=false, search=store.get("search2",false), nat=store.get("nat",false);
$("web").textContent=search?"🌐 On":"🌐 Off";
$("nat").textContent=nat?"🎙️ On":"🎙️ Off";
let gq=store.get("gq","");
$("key").value=key;$("gqkey").value=gq; $("spk").textContent=speak?"🔊 On":"🔇 Off";

function add(role,text){
  const d=document.createElement("div");
  d.className="msg "+(role==="user"?"me":"ai");
  d.textContent=text; $("chat").appendChild(d);
  $("chat").scrollTop=$("chat").scrollHeight; return d;
}
const HELLO="Namaste! Main Munim ji hoon. Kuch bhi poochho, bolo \"ye yaad rakhna…\" to note kar loonga, ya bolo \"kal subah 8 baje yaad dilana…\" to reminder laga doonga.";
function showHist(){
  $("chat").innerHTML="";
  hist.forEach(m=>add(m.role,m.parts[0].text));
  if(!hist.length) add("model",HELLO);
}
showHist();

function renderNotes(){
  $("notes").innerHTML="";
  if(!notes.length){$("notes").innerHTML='<p style="color:var(--mut)">Abhi koi note nahi.</p>';}
  notes.forEach((n,i)=>{
    const d=document.createElement("div");d.className="note";
    const s=document.createElement("span");s.textContent=n;
    const b=document.createElement("button");b.textContent="🗑";
    b.onclick=()=>{notes.splice(i,1);store.set("notes",notes);renderNotes()};
    d.append(s,b);$("notes").appendChild(d);
  });
}
renderNotes();

function fmt(ms){
  return new Date(ms).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit",hour12:true});
}
function renderRems(){
  const box=$("rems");box.innerHTML="";
  if(!rems.length){box.innerHTML='<p style="color:var(--mut)">Abhi koi reminder nahi. Chat me bolo "kal 5 baje doodh lana yaad dilana" ya neeche se daalo.</p>';return;}
  rems.slice().sort((a,b)=>a.at-b.at).forEach(r=>{
    const d=document.createElement("div");d.className="note";
    const s=document.createElement("span");
    s.textContent=(r.done?"✅ ":"⏰ ")+r.text;
    const sm=document.createElement("small");
    sm.textContent=fmt(r.at)+(r.done?(r.late?" · chhoot gaya tha":" · ho gaya"):"");
    s.appendChild(sm);
    const b=document.createElement("button");b.textContent="🗑";
    b.onclick=()=>{rems=rems.filter(x=>x.id!==r.id);store.set("rems",rems);renderRems()};
    d.append(s,b);box.appendChild(d);
  });
}
renderRems();

/* ---------- awaaz ---------- */
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices().filter(v=>/^hi/i.test(v.lang));
    return vs.find(v=>/google/i.test(v.name))||vs.find(v=>!v.localService)||vs[0]||null;
  }catch(e){return null}
}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
function browserSay(t){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang="hi-IN";
  const v=pickVoice();if(v)u.voice=v;
  u.rate=0.92;u.pitch=1;
  speechSynthesis.speak(u);
}
const TTS_MODELS=["gemini-2.5-flash-preview-tts","gemini-2.5-flash-tts"];
let curSrc=null,sayId=0;
function stopAudio(){try{curSrc&&curSrc.stop()}catch(e){};curSrc=null;}
async function geminiSpeak(t,id){
  if(!key||!actx)return false;
  for(const m of TTS_MODELS){
    const ac=new AbortController();const to=setTimeout(()=>ac.abort(),20000);
    try{
      const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent?key="+encodeURIComponent(key),{
        method:"POST",headers:{"Content-Type":"application/json"},signal:ac.signal,
        body:JSON.stringify({
          contents:[{parts:[{text:"Say in a warm, calm, friendly Indian tone: "+t}]}],
          generationConfig:{responseModalities:["AUDIO"],speechConfig:{voiceConfig:{prebuiltVoiceConfig:{voiceName:"Charon"}}}}
        })
      });
      clearTimeout(to);
      if(!r.ok)continue;
      const j=await r.json();
      const p=j.candidates?.[0]?.content?.parts?.find(x=>x.inlineData);
      if(!p)continue;
      if(id!==sayId)return true;
      const rate=+(/rate=(\d+)/.exec(p.inlineData.mimeType||"")||[0,24000])[1];
      const bin=atob(p.inlineData.data),n=bin.length>>1;
      const buf=actx.createBuffer(1,n,rate),ch=buf.getChannelData(0);
      for(let i=0;i<n;i++){let v=bin.charCodeAt(2*i)|(bin.charCodeAt(2*i+1)<<8);if(v&0x8000)v-=0x10000;ch[i]=v/32768;}
      stopAudio();
      const src=actx.createBufferSource();src.buffer=buf;src.connect(actx.destination);src.start();curSrc=src;
      return true;
    }catch(e){clearTimeout(to);}
  }
  return false;
}
async function say(t){
  if(!speak)return;
  const id=++sayId;
  stopAudio();if(window.speechSynthesis)speechSynthesis.cancel();
  t=t.replace(/[\u{1F000}-\u{1FFFF}\u2600-\u27BF\uFE0F]/gu,"").trim().slice(0,500);
  if(!t)return;
  let ok=false;
  if(nat){try{ok=await geminiSpeak(t,id);}catch(e){}}
  if(!ok&&id===sayId)browserSay(t);
}

/* ---------- reminders ---------- */
let actx=null;
document.addEventListener("pointerdown",()=>{
  try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume();}catch(e){}
},{once:false});
function beep(){
  if(!actx)return;
  try{
    [0,0.35,0.7].forEach(t=>{
      const o=actx.createOscillator(),g=actx.createGain();
      o.frequency.value=880;o.connect(g);g.connect(actx.destination);
      g.gain.setValueAtTime(0.25,actx.currentTime+t);
      o.start(actx.currentTime+t);o.stop(actx.currentTime+t+0.25);
    });
  }catch(e){}
}
function ring(r){
  const txt=(r.late?"⏰ (chhoot gaya) ":"⏰ ")+r.text;
  const a=document.createElement("div");a.className="alert";
  const s=document.createElement("span");s.textContent=txt;
  const b=document.createElement("button");b.textContent="Theek hai";
  b.onclick=()=>a.remove();
  a.append(s,b);$("alerts").appendChild(a);
  add("model",txt);
  beep();
  try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300]);}catch(e){}
  say("Yaad dilana. "+r.text);
}
function checkRems(){
  const now=Date.now();let ch=false;
  rems.forEach(r=>{
    if(!r.done&&r.at<=now){r.done=true;r.late=(now-r.at)>120000;ch=true;ring(r);}
  });
  if(ch){store.set("rems",rems);renderRems();}
}
setInterval(checkRems,15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkRems();});
setTimeout(checkRems,800);

function addRem(at,text){
  rems.push({id:Date.now()+Math.random(),at,text,done:false});
  store.set("rems",rems);renderRems();
}

/* ---------- AI chat ---------- */
function nowStr(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+" ("+days[d.getDay()]+")";
}

async function groqChat(c,sys,web){
  const msgs=[{role:"system",content:sys+(web?"":" (Abhi tumhare paas web search nahi hai.)")}].concat(
    c.map(m=>({role:m.role==="model"?"assistant":"user",content:m.parts[0].text})));
  const ac=new AbortController();const to=setTimeout(()=>ac.abort(),30000);
  let r;
  try{
    r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",signal:ac.signal,
      headers:{"Authorization":"Bearer "+gq,"Content-Type":"application/json"},
      body:JSON.stringify({model:web?"groq/compound-mini":"llama-3.3-70b-versatile",messages:msgs,temperature:0.6,max_tokens:600})
    });
  }catch(e){clearTimeout(to);throw new Error("Backup AI (Groq) tak pahunch nahi paye. Net check karo.");}
  clearTimeout(to);
  if(r.status===401)throw new Error("Groq key galat hai. ⚙️ me dobara daalo.");
  if(r.status===429)throw new Error("Gemini aur Groq dono ki free limit abhi khatam hai. Thodi der baad try karo.");
  if(!r.ok)throw new Error("Groq error "+r.status);
  const j=await r.json();
  return j.choices?.[0]?.message?.content||"(khaali jawab)";
}

async function ask(text){
  if(busy)return;
  if(!key&&!gq){add("model","Pehle ⚙️ me Gemini API key daalo.");$("set").style.display="flex";return;}
  busy=true;
  add("user",text);
  hist.push({role:"user",parts:[{text}]});
  const wait=add("model","…");
  const sys="Tum 'Munim ji' ho, ek desi, bharosemand personal assistant. Hinglish (Roman Hindi) me chhote, saaf jawab do. "+
   "Agar user kuch yaad rakhne ya note karne ko kahe, to jawab ke aakhir me alag line me likho: SAVE_NOTE: <note ka text>. "+
   "Agar user kisi time pe yaad dilane ko kahe, to jawab ke aakhir me alag line me likho: REMINDER: YYYY-MM-DD HH:MM | <kya yaad dilana hai>. "+
   "Time 24 ghante format me, user ke local time me likho. Aaj abhi ka local time: "+nowStr()+". "+
   "'kal', 'subah', 'shaam', 'parson' jaise shabd isi time se hisaab karke date nikalo. Subah=08:00, dopahar=13:00, shaam=18:00, raat=21:00 maan lo agar exact time na bataye. "+
   "Reminder lagane pe jawab me bhi bata do ki kab yaad dilaoge. "+
   (search?"Taaza ya badalti cheezon (news, mausam, rate, score, aaj ki khabar) ke liye web search use karo, aur jawab chhota rakho. ":"")+
   "User ke pending reminders:\n"+(rems.filter(r=>!r.done).sort((a,b)=>a.at-b.at).map(r=>fmt(r.at)+" - "+r.text).join("\n")||"(koi nahi)")+"\n"+
   "User ki saved notes:\n"+(notes.join("\n")||"(koi nahi)");
  try{
    let c=hist.slice(-8);
    while(c.length&&c[0].role!=="user")c.shift();
    let r={ok:false,status:429},j={},useTools=search;
    for(let i=0;i<(key?MODELS.length:0);i++){
      const ac=new AbortController();const to=setTimeout(()=>ac.abort(),30000);
      try{
        const body={system_instruction:{parts:[{text:sys}]},contents:c};
        if(useTools)body.tools=[{google_search:{}}];
        r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+MODELS[i]+":generateContent?key="+encodeURIComponent(key),{
          method:"POST",headers:{"Content-Type":"application/json"},signal:ac.signal,
          body:JSON.stringify(body)
        });
        j=await r.json();
      }catch(e){
        r={ok:false,status:503};j={error:{message:"Server ne der kar di (timeout). Thodi der baad try karo."}};
      }
      clearTimeout(to);
      if(!r.ok&&r.status===400&&useTools){useTools=false;i--;continue;}
      if(r.ok||![500,503,404].includes(r.status))break;
      wait.textContent="Thoda busy hai, dusra model try kar raha hoon ("+(i+1)+"/"+MODELS.length+")…";
      await new Promise(s=>setTimeout(s,1200));
    }
    let fromGroq=false,gout="";
    if(!r.ok&&gq){
      wait.textContent="Gemini busy/limit me hai, backup AI (Groq) try kar raha hoon…";
      gout=await groqChat(c,sys,search);fromGroq=true;
    }
    if(!fromGroq&&!r.ok&&r.status===429) throw new Error("Free limit abhi khatam hai. Thodi der ruko (1 min) ya dopahar 1:30 baje (IST) ke baad try karo. 🌐 aur 🎙️ Off rakho to limit kam khayegi.");
    if(!fromGroq&&!r.ok) throw new Error(j.error?.message||"Error "+r.status);
    let out=fromGroq?gout:(j.candidates?.[0]?.content?.parts?.map(p=>p.text).join("")||"(khaali jawab)");
    let extra=fromGroq?(search?"\n⚡ Backup AI (Groq) se jawab, web search ke saath.":"\n⚡ Backup AI (Groq) se jawab."):"";
    const gc=fromGroq?null:j.candidates?.[0]?.groundingMetadata?.groundingChunks;
    if(gc&&gc.length){
      const names=[...new Set(gc.map(g=>g.web?.title).filter(Boolean))].slice(0,3);
      if(names.length)extra+="\n🌐 Source: "+names.join(", ");
    }

    const m=out.match(/SAVE_NOTE:\s*(.+)/);
    if(m){notes.push(m[1].trim());store.set("notes",notes);renderNotes();extra+="\n📝 Note save ho gaya.";}

    const re=/REMINDER:\s*(\d{4})-(\d{1,2})-(\d{1,2})\s+(\d{1,2}):(\d{2})\s*\|\s*(.+)/g;
    let rm;
    while((rm=re.exec(out))!==null){
      const at=new Date(+rm[1],+rm[2]-1,+rm[3],+rm[4],+rm[5]).getTime();
      if(isNaN(at)||at<=Date.now()){extra+="\n⚠️ Wo time nikal chuka hai, reminder nahi laga. Naya time batao.";}
      else{addRem(at,rm[6].trim());extra+="\n⏰ Reminder laga diya: "+fmt(at);}
    }

    out=out.replace(/^\s*(SAVE_NOTE|REMINDER):.*$/gm,"").trim()+extra;
    wait.textContent=out;
    hist.push({role:"model",parts:[{text:out}]});
    store.set("hist",hist.slice(-40));
    say(out.replace(/[📝⏰⚠️🌐⚡].*/g,""));
  }catch(e){
    wait.textContent="Dikkat aayi: "+e.message;
    hist.pop();
  }finally{busy=false;}
}

function go(){const t=$("inp").value.trim();if(!t||busy)return;$("inp").value="";ask(t);}
$("send").onclick=go;
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter")go()});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
$("mic").onclick=()=>{
  if(!SR){add("model","Is browser me voice input nahi hai. Chrome use karo.");return;}
  const r=new SR();r.lang="hi-IN";r.interimResults=false;
  $("mic").textContent="🔴";
  r.onresult=e=>ask(e.results[0][0].transcript);
  r.onerror=()=>{};
  r.onend=()=>{$("mic").textContent="🎤"};
  try{r.start()}catch(e){}
};

$("clr").onclick=()=>{
  if(!confirm("Chat saaf kar doon? (Notes aur reminders safe rahenge)"))return;
  hist=[];store.set("hist",hist);showHist();
};
$("cfg").onclick=()=>{$("set").style.display=$("set").style.display==="flex"?"none":"flex"};
$("saveGq").onclick=()=>{gq=$("gqkey").value.trim();store.set("gq",gq);$("set").style.display="none";add("model",gq?"✅ Groq backup save ho gaya.":"Groq key hata di.");};
$("saveKey").onclick=()=>{key=$("key").value.trim();store.set("key",key);$("set").style.display="none";};
$("nat").onclick=()=>{nat=!nat;store.set("nat",nat);$("nat").textContent=nat?"🎙️ On":"🎙️ Off";};
$("web").onclick=()=>{search=!search;store.set("search2",search);$("web").textContent=search?"🌐 On":"🌐 Off";};
$("spk").onclick=()=>{speak=!speak;store.set("speak",speak);$("spk").textContent=speak?"🔊 On":"🔇 Off";if(!speak){sayId++;stopAudio();if(window.speechSynthesis)speechSynthesis.cancel();}};

function tab(n){
  const names=["chat","notes","rem"];
  $("chat").classList.toggle("hide",n!=="chat");$("bar").classList.toggle("hide",n!=="chat");
  $("notes").classList.toggle("hide",n!=="notes");$("nbar").classList.toggle("hide",n!=="notes");
  $("rems").classList.toggle("hide",n!=="rem");$("rbar").classList.toggle("hide",n!=="rem");
  $("tChat").classList.toggle("on",n==="chat");
  $("tNotes").classList.toggle("on",n==="notes");
  $("tRem").classList.toggle("on",n==="rem");
}
$("tChat").onclick=()=>tab("chat");$("tNotes").onclick=()=>tab("notes");$("tRem").onclick=()=>tab("rem");
$("nadd").onclick=()=>{const t=$("ninp").value.trim();if(!t)return;notes.push(t);store.set("notes",notes);$("ninp").value="";renderNotes();};
$("radd").onclick=()=>{
  const t=$("rinp").value.trim(),v=$("rdt").value;
  if(!t||!v)return;
  const at=new Date(v).getTime();
  if(isNaN(at)||at<=Date.now()){alert("Time aage ka chuno.");return;}
  addRem(at,t);$("rinp").value="";$("rdt").value="";
};


/* ---------- sync (GitHub private repo) ---------- */
let gh=store.get("gh",{token:"",repo:"Ashucryt71/munim-data"});
localUpd=store.get("upd",0);
$("ghrepo").value=gh.repo||"";$("ghtok").value=gh.token||"";
function touchSync(){
  localUpd=Date.now();
  try{localStorage.setItem("upd",JSON.stringify(localUpd));}catch(e){}
  clearTimeout(pushTimer);
  if(gh.token)pushTimer=setTimeout(()=>syncNow(false),3000);
}
function ghUrl(){return "https://api.github.com/repos/"+gh.repo+"/contents/munim-data.json";}
function ghHead(){return {"Authorization":"Bearer "+gh.token,"Accept":"application/vnd.github+json"};}
async function ghGet(){
  const r=await fetch(ghUrl()+"?t="+Date.now(),{headers:ghHead(),cache:"no-store"});
  if(r.status===404){ghSha=null;return null;}
  if(!r.ok)throw new Error(r.status===401?"Token galat ya expire hai":(r.status===403?"Token ko repo ki permission nahi":"GitHub error "+r.status));
  const j=await r.json();ghSha=j.sha;
  return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))));
}
async function ghPut(data){
  const body={message:"sync",content:btoa(unescape(encodeURIComponent(JSON.stringify(data))))};
  if(ghSha)body.sha=ghSha;
  const r=await fetch(ghUrl(),{method:"PUT",headers:ghHead(),body:JSON.stringify(body)});
  if(r.status===409||r.status===422)throw new Error("conflict");
  if(!r.ok)throw new Error(r.status===404?"Repo nahi mila (naam ya token permission check karo)":"GitHub error "+r.status);
  ghSha=(await r.json()).content.sha;
}
async function syncNow(manual){
  if(!gh.token||!gh.repo){if(manual){add("model","Pehle ⚙️ me GitHub repo aur token daalo.");$("set").style.display="flex";}return;}
  if(syncing)return;
  syncing=true;$("syn").textContent="🔄 …";
  try{
    for(let tries=0;tries<2;tries++){
      const rd=await ghGet();
      if(rd&&rd.updated>localUpd){
        applying=true;
        notes=rd.notes||[];rems=rd.rems||[];
        store.set("notes",notes);store.set("rems",rems);
        applying=false;
        localUpd=rd.updated;store.set("upd",localUpd);
        renderNotes();renderRems();checkRems();
      }else if(!rd||localUpd>rd.updated){
        try{await ghPut({notes,rems,updated:localUpd||Date.now()});}
        catch(e){if(e.message==="conflict"&&tries===0)continue;throw e;}
      }
      break;
    }
    $("syn").textContent="✅ Sync";
    if(manual)add("model","✅ Sync ho gaya.");
  }catch(e){
    applying=false;
    $("syn").textContent="⚠️ Sync";
    if(manual)add("model","Sync me dikkat: "+e.message);
  }finally{syncing=false;}
}
$("syn").onclick=()=>syncNow(true);
$("saveGh").onclick=()=>{
  gh={repo:$("ghrepo").value.trim(),token:$("ghtok").value.trim()};
  store.set("gh",gh);$("set").style.display="none";syncNow(true);
};
setTimeout(()=>syncNow(false),1200);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncNow(false);});
setInterval(()=>{if(!document.hidden)syncNow(false);},60000);

/* ---------- subah ka brief ---------- */
function runBrief(){
  if(busy)return;
  const now=new Date(),dn=["Ravivar","Somvar","Mangalvar","Budhvar","Guruvar","Shukravar","Shanivar"][now.getDay()];
  const same=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
  const pend=rems.filter(r=>!r.done).sort((a,b)=>a.at-b.at);
  const today=pend.filter(r=>same(new Date(r.at),now));
  const later=pend.filter(r=>!same(new Date(r.at),now)).slice(0,3);
  let t="Ram Ram! Aaj "+dn+" hai, "+now.toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})+".\n";
  t+=today.length?"\n⏰ Aaj ke reminders:\n"+today.map(r=>"• "+new Date(r.at).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",hour12:true})+" - "+r.text).join("\n"):"\n⏰ Aaj koi reminder nahi.";
  if(later.length)t+="\n\nAage ke reminders:\n"+later.map(r=>"• "+fmt(r.at)+" - "+r.text).join("\n");
  t+=notes.length?"\n\n📝 Notes ("+notes.length+"):\n"+notes.slice(-3).map(n=>"• "+(n.length>60?n.slice(0,60)+"…":n)).join("\n"):"\n\n📝 Abhi koi note nahi.";
  add("user","☀️ Subah ka brief");
  hist.push({role:"user",parts:[{text:"☀️ Subah ka brief"}]});
  add("model",t);
  hist.push({role:"model",parts:[{text:t}]});
  store.set("hist",hist.slice(-40));
  say(t);
}
$("brf").onclick=()=>{tab("chat");runBrief();};
(function autoBrief(){
  const d=new Date(),day=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  if(d.getHours()>=12||store.get("briefDay","")===day)return;
  store.set("briefDay",day);
  setTimeout(runBrief,1500);
})();
